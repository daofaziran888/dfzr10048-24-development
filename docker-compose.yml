services:
  backend:
    build: ./backend
    ports:
      - "8005:8005"
    environment:
      - APP_ENV=local
    # 改标事件、装配稿等可追溯数据落盘到命名卷，容器重启后仍可读回。
    volumes:
      - traceability_data:/srv/app/runtime_data
  frontend:
    build: ./frontend
    ports:
      - "5178:5178"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8005
    depends_on:
      - backend

volumes:
  traceability_data:

